<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Ultron</title>
    <style>
        /* Modern Typography & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: transparent; /* Transparent for macOS vibrancy */
            color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }
        
        /* Modern Premium Container */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(13, 17, 30, 0.55); /* Clean translucent dark tint */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }
        
        /* Header section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
            margin-bottom: 14px;
        }
        
        .title-group h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-badge {
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-select {
            background: rgba(13, 17, 30, 0.7);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #93c5fd;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .model-select:hover {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .model-select option {
            background: #0f172a;
            color: #f1f5f9;
        }

        .metrics-badge {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .mute-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 4px;
        }

        .mute-btn.muted {
            background: rgba(239, 68, 68, 0.5);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }

        .panel-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .action-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(99, 102, 241, 0.3);
            color: #ffffff;
        }

        .memory-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 520px;
            max-height: 70vh;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .memory-list {
            flex: 1;
            overflow-y: auto;
            margin: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .memory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .memory-del-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.65rem;
            cursor: pointer;
        }
        
        /* Senses bar with capsules */
        .senses-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        
        .sense-capsule {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot.blue { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .dot.red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        /* Main split section */
        .main-viewport {
            flex: 1;
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
            min-height: 180px;
        }
        
        /* Panels general styling */
        .panel-label {
            position: absolute;
            top: 10px;
            left: 14px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #64748b;
            text-transform: uppercase;
            z-index: 10;
        }
        
        /* Visualizer (Left) */
        .visualizer-container {
            flex: 1.6;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas#waveCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Webcam container (Right) */
        .webcam-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .webcam-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .webcam-placeholder::before {
            content: "🎥";
            font-size: 1.5rem;
            opacity: 0.3;
        }
        
        .webcam-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 11px;
        }
        
        .rec-label {
            position: absolute;
            top: 10px;
            right: 14px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            z-index: 10;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            50% { opacity: 0.5; }
        }
        
        /* Logs panel */
        .logs-container {
            height: 120px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px 14px 10px 14px;
            position: relative;
            margin-bottom: 14px;
        }
        
        .logs-panel {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .log-row {
            line-height: 1.4;
            color: #94a3b8;
        }
        
        .log-prefix {
            color: #6366f1;
            font-weight: 600;
            margin-right: 5px;
        }
        
        /* Input Bar */
        .input-bar {
            display: flex;
            gap: 10px;
        }
        
        input#userInput {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 18px;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }
        
        input#userInput:focus {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
        }
        
        button#sendBtn {
            background: #6366f1;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button#sendBtn:hover {
            background: #4f46e5;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        /* Visualization Overlay */
        .visualization-overlay {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            bottom: 80px;
            background: rgba(13, 17, 30, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
        }
        .vis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .vis-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #38bdf8;
            text-transform: uppercase;
        }
        .vis-close {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .vis-close:hover {
            background: rgba(259, 68, 68, 0.1);
            border-color: rgba(259, 68, 68, 0.3);
            color: #f87171;
        }
        .vis-content {
            flex: 1;
            overflow-y: auto;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }
        .vis-content::-webkit-scrollbar {
            width: 6px;
        }
        .vis-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .vis-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>ULTRON <span style="font-weight: 300; opacity: 0.5;">// SENSES</span></h1>
            </div>
            <div class="header-controls">
                <div class="metrics-badge" id="metricsBadge">CPU: --% | RAM: --%</div>
                <select id="modelSelector" class="model-select" title="Switch Gemini Model">
                    <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
                    <option value="gemini-2.5-flash-live-preview">gemini-2.5-flash-live-preview</option>
                    <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
                    <option value="gemini-2.0-flash-realtime-exp">gemini-2.0-flash-realtime-exp</option>
                </select>
                <select id="voiceSelector" class="model-select" title="Switch Voice Preset">
                    <option value="Puck">Voice: Puck</option>
                    <option value="Charon">Voice: Charon</option>
                    <option value="Kore">Voice: Kore</option>
                    <option value="Fenrir">Voice: Fenrir</option>
                    <option value="Aoede">Voice: Aoede</option>
                </select>
                <div class="status-badge" id="statusBadge">Initializing</div>
            </div>
        </div>
        
        <!-- Senses capsules -->
        <div class="senses-bar">
            <div class="sense-capsule">
                <span class="dot green"></span>
                <span>MIC: ONLINE</span>
                <button id="muteBtn" class="mute-btn">MUTE</button>
            </div>
            <div class="sense-capsule" id="screenCapsule">
                <span class="dot blue" id="screenDot"></span>
                <span id="screenText">SCREEN: READY</span>
            </div>
            <div class="sense-capsule" id="camCapsule">
                <span class="dot red" id="camDot"></span>
                <span id="camText">CAM: ONLINE</span>
            </div>
        </div>

        <!-- Split main section -->
        <div class="main-viewport">
            <!-- Visualizer (Left) -->
            <div class="visualizer-container">
                <div class="panel-label">Visualizer Core</div>
                <canvas id="waveCanvas"></canvas>
            </div>
            
            <!-- Webcam (Right) -->
            <div class="webcam-container">
                <div class="panel-label" id="camLabel">Camera Feed // Standby</div>
                <div class="rec-label" id="recLabel" style="display: none;">REC</div>
                <div class="webcam-placeholder" id="webcamPlaceholder">
                    NO SIGNAL // STANDBY
                </div>
                <img id="webcamImg" src="" alt="Webcam Stream" style="display: none;">
            </div>
        </div>
        
        <!-- Logs -->
        <div class="logs-container">
            <div class="panel-header-row">
                <div class="panel-label" style="position: static;">System Console</div>
                <div>
                    <button id="memoryBtn" class="action-btn">MEMORY FACTS</button>
                    <button id="exportLogBtn" class="action-btn">EXPORT LOG</button>
                </div>
            </div>
            <div class="logs-panel" id="logsPanel"></div>
        </div>
        
        <!-- Input -->
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Submit instruction or request..." autocomplete="off">
            <button id="sendBtn">SEND</button>
        </div>

        <!-- Visualization Overlay -->
        <div class="visualization-overlay" id="visOverlay">
            <div class="vis-header">
                <span class="vis-title" id="visTitle">Visualization Module</span>
                <button class="vis-close" id="visCloseBtn">CLOSE_SYS</button>
            </div>
            <div class="vis-content" id="visContent"></div>
        </div>

        <!-- Memory Overlay -->
        <div class="memory-modal" id="memoryModal">
            <div class="vis-header">
                <span class="vis-title">Persistent Memory Facts</span>
                <button class="vis-close" id="memoryCloseBtn">CLOSE</button>
            </div>
            <div class="memory-list" id="memoryList"></div>
        </div>
    </div>
    
    <script>
        let ws;
        const statusBadge = document.getElementById('statusBadge');
        const modelSelector = document.getElementById('modelSelector');
        const voiceSelector = document.getElementById('voiceSelector');
        const metricsBadge = document.getElementById('metricsBadge');
        const muteBtn = document.getElementById('muteBtn');
        const exportLogBtn = document.getElementById('exportLogBtn');
        const memoryBtn = document.getElementById('memoryBtn');
        const memoryModal = document.getElementById('memoryModal');
        const memoryList = document.getElementById('memoryList');
        const logsPanel = document.getElementById('logsPanel');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        const screenText = document.getElementById('screenText');
        const screenDot = document.getElementById('screenDot');
        
        const camText = document.getElementById('camText');
        const camDot = document.getElementById('camDot');
        const camLabel = document.getElementById('camLabel');
        const recLabel = document.getElementById('recLabel');
        const webcamPlaceholder = document.getElementById('webcamPlaceholder');
        const webcamImg = document.getElementById('webcamImg');
        
        let appState = {
            status: "Initializing",
            screen: "READY",
            webcam: "READY"
        };
        
        function appendLog(text) {
            const row = document.createElement('div');
            row.className = 'log-row';
            row.innerHTML = `<span class="log-prefix">></span> ${text}`;
            logsPanel.appendChild(row);
            logsPanel.scrollTop = logsPanel.scrollHeight;
            
            while (logsPanel.children.length > 100) {
                logsPanel.removeChild(logsPanel.firstChild);
            }
        }
        
        function connectWS() {
            ws = new WebSocket('ws://localhost:8765');
            
            ws.onopen = () => {
                appendLog('Connection established with backend.');
            };
            
            ws.onclose = () => {
                appendLog('Connection lost. Retrying...');
                setTimeout(connectWS, 2000);
            };
            
            ws.onerror = () => {
                ws.close();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    appState.status = data.value;
                    statusBadge.textContent = data.value;
                    
                    if (data.value.includes('Listening')) {
                        statusBadge.style.color = '#10b981';
                        statusBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                        statusBadge.style.background = 'rgba(16, 185, 129, 0.08)';
                        statusBadge.style.boxShadow = '0 2px 10px rgba(16, 185, 129, 0.1)';
                    } else if (data.value.includes('Speaking') || data.value.includes('Thinking') || data.value.includes('Executing')) {
                        statusBadge.style.color = '#f43f5e';
                        statusBadge.style.borderColor = 'rgba(244, 63, 94, 0.3)';
                        statusBadge.style.background = 'rgba(244, 63, 94, 0.08)';
                        statusBadge.style.boxShadow = '0 2px 10px rgba(244, 63, 94, 0.1)';
                    } else {
                        statusBadge.style.color = '#818cf8';
                        statusBadge.style.borderColor = 'rgba(99, 102, 241, 0.3)';
                        statusBadge.style.background = 'rgba(99, 102, 241, 0.08)';
                        statusBadge.style.boxShadow = '0 2px 10px rgba(99, 102, 241, 0.1)';
                    }
                } else if (data.type === 'log') {
                    appendLog(data.value);
                } else if (data.type === 'senses') {
                    appState.screen = data.screen;
                    appState.webcam = data.webcam;
                    
                    screenText.textContent = `SCREEN: ${data.screen}`;
                    camText.textContent = `CAM: ${data.webcam}`;
                    
                    screenDot.className = `dot ${data.screen === 'STREAMING' ? 'red' : 'blue'}`;
                    camDot.className = `dot ${data.webcam === 'STREAMING' ? 'red' : 'blue'}`;
                    
                    if (data.webcam !== 'STREAMING') {
                        webcamImg.style.display = 'none';
                        webcamPlaceholder.style.display = 'flex';
                        recLabel.style.display = 'none';
                        camLabel.textContent = 'Camera Feed // Standby';
                    }
                } else if (data.type === 'webcam_frame') {
                    webcamPlaceholder.style.display = 'none';
                    webcamImg.style.display = 'block';
                    webcamImg.src = data.image;
                    recLabel.style.display = 'block';
                    camLabel.textContent = 'Camera Feed // Live';
                } else if (data.type === 'webcam_off') {
                    webcamImg.style.display = 'none';
                    webcamPlaceholder.style.display = 'flex';
                    recLabel.style.display = 'none';
                    camLabel.textContent = 'Camera Feed // Standby';
                } else if (data.type === 'visualization') {
                    const overlay = document.getElementById('visOverlay');
                    const title = document.getElementById('visTitle');
                    const content = document.getElementById('visContent');
                    
                    title.textContent = `Visualization // ${data.title.toUpperCase()}`;
                    content.innerHTML = data.html;
                    overlay.style.display = 'flex';
                    
                    const scripts = content.getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        const s = document.createElement('script');
                        s.text = scripts[i].text;
                        document.body.appendChild(s).parentNode.removeChild(s);
                    }
                } else if (data.type === 'model_update') {
                    if (data.models && Array.isArray(data.models)) {
                        modelSelector.innerHTML = '';
                        data.models.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            if (m === data.value) opt.selected = true;
                            modelSelector.appendChild(opt);
                        });
                    } else if (data.value) {
                        modelSelector.value = data.value;
                    }
                } else if (data.type === 'voice_update') {
                    if (data.voices && Array.isArray(data.voices)) {
                        voiceSelector.innerHTML = '';
                        data.voices.forEach(v => {
                            const opt = document.createElement('option');
                            opt.value = v;
                            opt.textContent = `Voice: ${v}`;
                            if (v === data.value) opt.selected = true;
                            voiceSelector.appendChild(opt);
                        });
                    } else if (data.value) {
                        voiceSelector.value = data.value;
                    }
                } else if (data.type === 'metrics') {
                    metricsBadge.textContent = `CPU: ${data.cpu}% | RAM: ${data.ram}%`;
                } else if (data.type === 'mute_update') {
                    if (data.value) {
                        muteBtn.classList.add('muted');
                        muteBtn.textContent = 'MUTED';
                    } else {
                        muteBtn.classList.remove('muted');
                        muteBtn.textContent = 'MUTE';
                    }
                } else if (data.type === 'memory_update') {
                    memoryList.innerHTML = '';
                    const mem = data.value || {};
                    const keys = Object.keys(mem);
                    if (keys.length === 0) {
                        memoryList.innerHTML = '<div style="color: #64748b; font-size: 0.8rem; text-align: center; padding: 20px;">No stored memory facts.</div>';
                    } else {
                        keys.forEach(k => {
                            const item = document.createElement('div');
                            item.className = 'memory-item';
                            item.innerHTML = `<span><strong>${k}</strong>: ${mem[k]}</span>`;
                            const delBtn = document.createElement('button');
                            delBtn.className = 'memory-del-btn';
                            delBtn.textContent = 'DELETE';
                            delBtn.onclick = () => {
                                if (ws && ws.readyState === WebSocket.OPEN) {
                                    ws.send(JSON.stringify({ type: 'delete_memory', key: k }));
                                }
                            };
                            item.appendChild(delBtn);
                            memoryList.appendChild(item);
                        });
                    }
                }
            };
        }
        
        connectWS();
        
        function sendMessage() {
            const text = userInput.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', value: text }));
                userInput.value = '';
            }
        }
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        sendBtn.addEventListener('click', sendMessage);
        
        modelSelector.addEventListener('change', (e) => {
            const selectedModel = e.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                appendLog(`Model switch requested -> ${selectedModel}`);
                ws.send(JSON.stringify({ type: 'switch_model', value: selectedModel }));
            }
        });

        voiceSelector.addEventListener('change', (e) => {
            const selectedVoice = e.target.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                appendLog(`Voice switch requested -> ${selectedVoice}`);
                ws.send(JSON.stringify({ type: 'switch_voice', value: selectedVoice }));
            }
        });

        muteBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'toggle_mute' }));
            }
        });

        exportLogBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                appendLog('Exporting session history...');
                ws.send(JSON.stringify({ type: 'export_history' }));
            }
        });

        memoryBtn.addEventListener('click', () => {
            memoryModal.style.display = 'flex';
        });

        document.getElementById('memoryCloseBtn').addEventListener('click', () => {
            memoryModal.style.display = 'none';
        });
        
        document.getElementById('visCloseBtn').addEventListener('click', () => {
            document.getElementById('visOverlay').style.display = 'none';
        });
        
        // Circular Sci-Fi Hologram Orb Visualizer
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        setTimeout(resizeCanvas, 100);
        
        function drawOrb() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            let isTalking = appState.status.includes('Speaking') || appState.status.includes('Thinking') || appState.status.includes('Executing');
            let baseRadius = isTalking ? 45 : 35;
            let orbPulse = baseRadius + Math.sin(angle * 3.5) * (isTalking ? 6 : 1.5);
            
            angle += isTalking ? 0.06 : 0.015;
            
            let primaryColor = isTalking ? 'rgba(244, 63, 94, 0.75)' : 'rgba(99, 102, 241, 0.75)';
            let secondaryColor = isTalking ? 'rgba(244, 63, 94, 0.15)' : 'rgba(99, 102, 241, 0.1)';
            
            // Outer rotating ring with arcs
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);
            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.arc(0, 0, orbPulse + 12, 0, Math.PI * 0.35);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, 0, orbPulse + 12, Math.PI * 0.5, Math.PI * 0.85);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, 0, orbPulse + 12, Math.PI, Math.PI * 1.35);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, 0, orbPulse + 12, Math.PI * 1.5, Math.PI * 1.85);
            ctx.stroke();
            ctx.restore();
            
            // Pulsing center glow
            let grad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, orbPulse);
            grad.addColorStop(0, primaryColor);
            grad.addColorStop(0.4, secondaryColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.beginPath();
            ctx.fillStyle = grad;
            ctx.arc(centerX, centerY, orbPulse, 0, Math.PI * 2);
            ctx.fill();
            
            // Central core crosshair
            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX - 8, centerY);
            ctx.lineTo(centerX - 2, centerY);
            ctx.moveTo(centerX + 2, centerY);
            ctx.lineTo(centerX + 8, centerY);
            ctx.moveTo(centerX, centerY - 8);
            ctx.lineTo(centerX, centerY - 2);
            ctx.moveTo(centerX, centerY + 2);
            ctx.lineTo(centerX, centerY + 8);
            ctx.stroke();
            
            // Audio wave deforming concentric ring when talking
            if (isTalking) {
                ctx.strokeStyle = 'rgba(244, 63, 94, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += 0.05) {
                    let waveMod = Math.sin(a * 7 + angle * 12) * 10 + Math.cos(a * 3 - angle * 6) * 5;
                    let r = orbPulse + 20 + waveMod;
                    let x = centerX + Math.cos(a) * r;
                    let y = centerY + Math.sin(a) * r;
                    if (a === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
            
            requestAnimationFrame(drawOrb);
        }
        drawOrb();
    </script>
</body>
</html>
