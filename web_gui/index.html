<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ultron</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient field: vignette + faint grid, no chrome -->
  <div class="ambient"></div>

  <!-- Stage: hero (core centred) until content exists, then the core docks
       top-left and the widget grid takes the canvas. -->
  <div class="stage hero" id="stage">
    <div class="core-mount" id="core-mount" title="Ultron — click to speak, Esc to interrupt">
      <canvas id="core-canvas"></canvas>
    </div>

    <div class="widget-grid" id="widget-grid">
      <!-- System widgets are pre-declared: sve.js and gestures.js bind to these
           nodes at module load. Hidden until their source goes live. -->

      <div class="widget widget-flush" data-system-widget="camera" hidden>
        <div class="widget-body">
          <div class="c-vision">
            <video id="webcam-video" autoplay playsinline muted></video>
            <img id="webcam-img" hidden />
            <canvas id="cam-overlay"></canvas>
          </div>
        </div>
        <div class="widget-tools">
          <button class="tool-btn" id="btn-cam-flip" title="Switch front/rear camera" hidden>⇄</button>
          <button class="tool-btn" id="btn-hands" title="Hand gesture control">✋</button>
        </div>
        <button class="widget-x" id="btn-cam-close" title="Stop camera"></button>
      </div>

      <div class="widget widget-flush" data-system-widget="screen" hidden>
        <div class="widget-body">
          <div class="c-vision">
            <img id="screen-img" />
          </div>
        </div>
        <button class="widget-x" id="btn-screen-close" title="Stop screen share"></button>
      </div>

      <div class="widget widget-flush" data-system-widget="spatial" hidden>
        <div class="widget-body">
          <div class="sve-stage">
            <div id="sve-viewport"></div>
            <div class="gesture-cursor" id="gesture-cursor"></div>
            <div class="gesture-hud" id="gesture-hud"></div>
            <div class="sve-info" id="sve-info"></div>
            <div class="sve-empty" id="sve-empty"></div>
          </div>
        </div>
        <div class="widget-tools">
          <div class="sve-scene-tabs" id="sve-scene-tabs"></div>
          <button class="tool-btn" id="btn-sve-reset" title="Reset view">⟲</button>
        </div>
        <button class="widget-x" id="btn-spatial-close" title="Dismiss"></button>
      </div>
    </div>
  </div>

  <!-- Action dock: mic / camera / screen. Cyan ring = live. -->
  <div class="dock" id="dock">
    <button class="dock-btn" id="btn-mic" title="Wake / sleep (double-clap or say “Ultron”)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3z" />
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0" />
        <path d="M12 17.5V21" />
      </svg>
    </button>
    <button class="dock-btn" id="btn-cam" title="Camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M3 8.5A2 2 0 0 1 5 6.5h3l1.2-2h5.6l1.2 2h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <circle cx="12" cy="12.5" r="3.4" />
      </svg>
    </button>
    <button class="dock-btn" id="btn-screen" title="Screen share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="3" y="4.5" width="18" height="12" rx="2" />
        <path d="M9 20h6M12 16.5V20" />
      </svg>
    </button>
  </div>

  <!-- Ephemeral command line: hidden until you type, click the core, or press / -->
  <div class="command" id="command" hidden>
    <input type="text" id="chat-input" placeholder="" autocomplete="off" spellcheck="false" />
    <select id="model-select" title="Active model"></select>
  </div>

  <!-- Remote command approval (Tailscale sessions asking to run shell/AppleScript) -->
  <div class="exec-approval" id="exec-approval" hidden>
    <div class="exec-approval-box">
      <div class="exec-approval-head">
        <span class="exec-approval-glyph">⚠</span>
        <span id="exec-approval-tool">Shell command</span>
      </div>
      <pre class="exec-approval-cmd" id="exec-approval-cmd"></pre>
      <div class="exec-approval-actions">
        <button class="exec-btn deny" id="exec-deny">Deny</button>
        <button class="exec-btn approve" id="exec-approve">Run it</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="core.js"></script>
  <script type="module" src="wake.js"></script>
  <script type="module" src="widgets.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="sve.js"></script>
  <script type="module" src="gestures.js"></script>
</body>
</html>
