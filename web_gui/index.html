<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultron</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">

    <!-- Hero Stage: Holds the 3D Orb. Starts centered, moves top-left when displaced -->
    <div id="hero-stage" class="hero-stage">
      <canvas id="visualizer-canvas"></canvas>
    </div>

    <!-- Widget Stage: Dynamic Title-Free Components -->
    <div id="widgetStage" class="widget-stage"></div>

    <!-- Action Dock: Bottom Right -->
    <div class="action-dock">
      <button class="dock-btn active" id="btn-mic" title="Microphone">
        <span class="icon">🎙️</span>
      </button>
      <button class="dock-btn" id="btn-cam" title="Camera">
        <span class="icon">📷</span>
      </button>
      <button class="dock-btn" id="btn-screen" title="Screen Share">
        <span class="icon">🖥️</span>
      </button>
      <button class="dock-btn" id="btn-fullscreen" title="Fullscreen">
        <span class="icon">⛶</span>
      </button>
    </div>

    <!-- Hidden feeds required for legacy bindings/functionality -->
    <div id="hidden-feeds" style="display: none;">
      <video id="webcam-video" autoplay playsinline muted></video>
      <img id="webcam-img" />
      <canvas id="cam-overlay"></canvas>
      <img id="screen-img" />
    </div>

  </div>

  <!-- Remote command approval -->
  <div class="exec-approval" id="exec-approval" style="display:none;">
    <div class="exec-approval-box">
      <div class="exec-approval-title">⚠ Command approval required</div>
      <div class="exec-approval-tool" id="exec-approval-tool">Shell command</div>
      <pre class="exec-approval-cmd" id="exec-approval-cmd"></pre>
      <div class="exec-approval-actions">
        <button class="exec-btn deny" id="exec-deny">Deny</button>
        <button class="exec-btn approve" id="exec-approve">Run it</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  
  <!-- The new engine modules will be imported within app.js, or directly here -->
  <script type="module">
    import { WakeEngine } from './wake_engine.js';
    import { GUIEngine } from './gui_engine.js';
    
    // Make engines available globally for app.js integration
    window.WakeEngine = WakeEngine;
    window.GUIEngine = GUIEngine;
  </script>
  
  <script type="module" src="sve.js"></script>
  <script type="module" src="gestures.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
