<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Ultron Visualizer</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #010101;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Glow */
        .glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0,255,255,0.7) 0%, rgba(0,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(15px);
            animation: ambientPulse 4s infinite alternate;
        }

        .visualizer-bars {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .bar {
            width: 10px;
            height: 20px;
            background: linear-gradient(to bottom, #00ffff, #008080);
            border-radius: 5px;
            animation: standBy 1.5s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* Animation for different bars */
        .bar:nth-child(1) { animation-delay: 0.1s; height: 30px; }
        .bar:nth-child(2) { animation-delay: 0.2s; height: 50px; }
        .bar:nth-child(3) { animation-delay: 0.3s; height: 70px; }
        .bar:nth-child(4) { animation-delay: 0.4s; height: 50px; }
        .bar:nth-child(5) { animation-delay: 0.5s; height: 30px; }

        @keyframes standBy {
            0%, 100% { transform: scaleY(1); opacity: 0.8; }
            50% { transform: scaleY(1.8); opacity: 1; }
        }

        @keyframes ambientPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0.9; }
        }

        /* Status Text */
        .status {
            position: absolute;
            bottom: 20px;
            color: #00ffff;
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ffff;
            animation: textFlicker 2s infinite;
        }

        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
            75% { opacity: 0.9; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="visualizer-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div class="status">LISTENING</div>
    </div>
</body>
</html>
