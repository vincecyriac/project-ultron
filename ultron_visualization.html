<!DOCTYPE html>
<html>
<head>
<title>How AI Works</title>
<style>
    body { font-family: 'Helvetica Neue', Helvetica, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { text-align: center; border: 2px solid #333; padding: 40px; border-radius: 15px; background: #1e1e1e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #4CAF50; margin-bottom: 30px; }
    .diagram { display: flex; justify-content: space-around; width: 600px; margin-top: 20px; }
    .box { border: 2px solid #4CAF50; padding: 20px; border-radius: 10px; width: 150px; background: #2e2e2e; transition: transform 0.3s; }
    .box:hover { transform: scale(1.05); background: #383838; }
    .arrow { font-size: 2em; color: #757575; align-self: center; }
</style>
</head>
<body>
    <div class="container">
        <h1>Understanding AI</h1>
        <p>Artificial Intelligence mimics human thought to solve complex problems.</p>
        <div class="diagram">
            <div class="box">Data Input</div>
            <div class="arrow">→</div>
            <div class="box">Processing & Analysis (Machine Learning)</div>
            <div class="arrow">→</div>
            <div class="box">Intelligent Output/Action</div>
        </div>
    </div>
</body>
</html>
